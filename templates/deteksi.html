{% extends 'base.html' %}
{% block title %}Deteksi CVPD{% endblock %}

{% block content %}
<div class="container mt-4">
  <h3 class="text-center text-primary mb-4">
    Deteksi Penyakit CVPD pada Daun Jeruk
  </h3>

  <div class="row g-4">

    <!-- ===== UPLOAD GAMBAR ===== -->
    <div class="col-md-6">
      <h5 class="fw-bold">📁 Upload dari Album</h5>

      <form action="{{ url_for('upload') }}"
            method="POST"
            enctype="multipart/form-data">

        <input type="file"
               name="gambar"
               class="form-control mb-3"
               accept="image/*"
               required>

        <button class="btn btn-primary w-100">
          🔍 Deteksi dari Album
        </button>
      </form>
    </div>

    <!-- ===== KAMERA ===== -->
    <div class="col-md-6 text-center">
      <h5 class="fw-bold">📸 Kamera Langsung</h5>

      <video id="video" autoplay class="w-100 rounded shadow"></video>
      <canvas id="canvas" style="display:none;"></canvas>

      <button class="btn btn-success mt-3 w-100"
              onclick="capture()">
        📷 Ambil Gambar & Deteksi
      </button>

      <!-- HASIL -->
      <div id="hasil" class="mt-3 fw-bold text-primary"></div>

      <!-- TOMBOL AKSI -->
      <div id="aksi" class="mt-4 d-none">
        <a href="{{ url_for('dashboard') }}"
           class="btn btn-secondary w-100 mb-2">
          ⬅ Kembali ke Dashboard
        </a>

        <a href="{{ url_for('statistik') }}"
           class="btn btn-outline-primary w-100">
          📊 Lihat Statistik
        </a>
      </div>
    </div>

  </div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');

// Aktifkan kamera
navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
  video.srcObject = stream;
  video.play();
})
.catch(err => {
  alert("Kamera tidak bisa diakses");
  console.error(err);
});

function capture() {
  if (video.videoWidth === 0) {
    alert("Kamera belum siap");
    return;
  }

  const maxWidth = 640;
  const scale = maxWidth / video.videoWidth;

  canvas.width = maxWidth;
  canvas.height = video.videoHeight * scale;

  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  canvas.toBlob(blob => {
    if (!blob) {
      alert("Gagal mengambil gambar");
      return;
    }

    const formData = new FormData();
    formData.append('image', blob, 'kamera.jpg');

    fetch('{{ url_for("kamera_deteksi") }}', {
      method: 'POST',
      body: formData
    })
    .then(res => res.json())
    .then(data => {
      document.getElementById('hasil').innerText =
        `Hasil: ${data.label} (${data.confidence}%)`;

      document.getElementById('aksi').classList.remove('d-none');
    })
    .catch(err => {
      console.error(err);
      alert("Terjadi kesalahan saat deteksi");
    });

  }, 'image/jpeg', 0.7);
}
</script>
{% endblock %}
