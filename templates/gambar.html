{% extends "base.html" %}

{% block title %}Informasi Jurusan{% endblock %}

{% block content %}
<h2>Informasi Jurusan</h2>
<div class="row">
    {% for jurusan in jurusan_list %}
    <div class="col-md-6">
        <div class="card mb-3">
            <div class="card-body">
                <h5>{{ jurusan.kode }} - {{ jurusan.nama }}</h5>
                <p>{{ jurusan.deskripsi }}</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
