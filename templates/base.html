<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Deteksi CVPD{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #6f8972;
        }
        .main-content {
            margin-left: 250px;
            padding: 20px;
        }
        .sidebar {
            width: 250px;
        }
         a {
            color: #ece2e2; 
            text-decoration: none;
        }

        a:hover {
            color: #bdb9b7;
            text-decoration: underline;
        }
        img.img-thumbnail {
            max-height: 100px;}

    </style>
</head>
<body>
    {% include '_sidebar.html' %}
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
